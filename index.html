<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생활 아이디어 소품 — 영상 속 제품 링크</title>
<style>
:root { --bg:#faf7f2; --card:#fff; --text:#1f1f1f; --muted:#6b6b6b; --accent:#c8102e; --line:#ece6dc; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#141414; --card:#1f1f1f; --text:#f2f2f2; --muted:#a0a0a0; --accent:#ff5a6e; --line:#2c2c2c; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:22px; margin:0 0 8px; }
.notice { font-size:12px; color:var(--muted); line-height:1.6; margin:0 0 20px; }
input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--card); color:var(--text); font-size:15px; margin-bottom:16px; }
.video { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
.video h2 { font-size:16px; margin:0 0 4px; }
.meta { font-size:12px; color:var(--muted); margin-bottom:10px; }
.item { display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 0; border-top:1px solid var(--line); }
.item span { font-size:14px; line-height:1.4; }
.item small { display:block; color:var(--muted); }
.item a { flex:none; text-decoration:none; background:var(--accent); color:#fff;
  font-size:13px; font-weight:700; padding:8px 12px; border-radius:10px; }
</style>
</head>
<body>
<main>
<h1>생활 아이디어 소품 — 영상 속 제품 링크</h1>
<p class="notice">이 콘텐츠는 제휴 링크를 포함하며, 구매 시 일정액의 수수료를 받을 수 있습니다.</p>
<input id="q" type="search" placeholder="영상 번호나 제품 이름으로 찾기" aria-label="검색">
<section class="video"><h2>곧 첫 영상이 올라옵니다</h2><div class="meta">영상 속 제품 링크는 이곳에 모아 둘게요.</div></section>
</main>
<script>
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.video').forEach(v => {
    v.style.display = v.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});
</script>
</body>
</html>
